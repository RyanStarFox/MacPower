name: Upload release to Baidu Netdisk

# Release uploads run on this Mac via scripts/sync_latest_release.py.
# Refreshing the Baidu token from a GitHub-hosted runner invalidates it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload, for example v1.2.11. Use all for every release.
        required: true
        default: v1.2.11

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Baidu configuration
        env:
          BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
          BAIDU_APP_NAME: ${{ vars.BAIDU_APP_NAME }}
        run: |
          if [ -z "$BAIDU_REFRESH_TOKEN" ]; then
            echo "::error::缺少 Secret BAIDU_REFRESH_TOKEN。在本机运行 python3 scripts/baidu_auth.py 完成一次授权。"
            exit 1
          fi
          if [ -z "$BAIDU_APP_NAME" ]; then
            echo "::error::缺少 Variable BAIDU_APP_NAME。填百度开放平台里的应用名称，文件会传到 /apps/该名称/releases/。"
            exit 1
          fi

      - name: Download release disk image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          if [ "$TAG" = "all" ]; then
            gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
              gh release download "$tag" --pattern 'MacPower-*.dmg' --dir "$RUNNER_TEMP/dmg" --clobber
            done
          else
            gh release download "$TAG" --pattern 'MacPower-*.dmg' --dir "$RUNNER_TEMP/dmg"
          fi
          ls -lh "$RUNNER_TEMP/dmg"

      - name: Upload to Baidu Netdisk
        env:
          BAIDU_APP_KEY: ${{ secrets.BAIDU_APP_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
          BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
          BAIDU_APP_NAME: ${{ vars.BAIDU_APP_NAME }}
        run: python3 scripts/upload_baidu.py "$RUNNER_TEMP"/dmg/*.dmg
